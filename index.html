<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMon-BHai PRO</title>

<style>
body {
    margin:0;
    font-family:sans-serif;
    background:#020617;
    color:white;
    display:flex;
}

/* Sidebar */
.sidebar {
    width:220px;
    background:#0f172a;
    padding:10px;
    overflow-y:auto;
}

.market {
    padding:10px;
    border-bottom:1px solid #1e293b;
    cursor:pointer;
}

.market:hover {
    background:#1e293b;
}

/* Main */
.main {
    flex:1;
    padding:20px;
    text-align:center;
}

.signal {
    font-size:40px;
    margin:20px;
}

.box {
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    max-width:400px;
    margin:auto;
}
</style>
</head>

<body>

<div class="sidebar" id="markets"></div>

<div class="main">
    <h2>🔥 EMon-BHai PRO 🔥</h2>

    <div class="box">
        <h3 id="pair">Select Market</h3>
        <div class="signal" id="signal">--</div>
        <p>Power: <span id="power">--</span></p>
        <p>Time: <span id="time">--</span></p>
    </div>
</div>

<script>
let currentPair = null;

// Load market list
async function loadMarkets(){
    const res = await fetch('/markets');
    const data = await res.json();

    const container = document.getElementById('markets');
    container.innerHTML = '';

    data.forEach(m => {
        const div = document.createElement('div');
        div.className = 'market';
        div.innerText = m.name;

        div.onclick = () => {
            currentPair = m.name;
            fetchSignal();
        };

        container.appendChild(div);
    });
}

// Fetch signal
async function fetchSignal(){
    if(!currentPair) return;

    const res = await fetch('/signal/' + currentPair);
    const data = await res.json();

    if(data.error){
        document.getElementById('signal').innerText = data.error;
        return;
    }

    document.getElementById('pair').innerText = currentPair;
    document.getElementById('signal').innerText = data.signal;
    document.getElementById('power').innerText = data.power || '--';
    document.getElementById('time').innerText = new Date().toLocaleTimeString();
}

// Auto refresh
setInterval(fetchSignal, 10000);

// Init
loadMarkets();
</script>

</body>
</html>
